name: payment-service-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      target: test
    environment:
      API_KEY: test-api-key
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/payments_db
    depends_on:
      postgres:
        condition: service_healthy
