[project]
name = "payment-service"
version = "1.0.0"
description = "Asynchronous payment processing service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.1",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "dishka>=1.4.0",
    "dishka-faststream>=0.7.0",
    "fastapi>=0.115.0",
    "faststream[rabbit]>=0.7.8,<0.8",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]
test = [
    "hypothesis>=6.170.13",
    "mutmut>=3.8.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "pytest-socket>=0.8.1",
    "respx>=0.21.0",
    "schemathesis>=4.32.7",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[tool.uv]
package = true
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payment_service"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "ANN",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "ISC",
    "N",
    "PLR2004",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "ANN401",
    "B008",
    "RUF001",
]

[tool.ruff.lint.isort]
known-first-party = ["payment_service"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",
    "ARG001",
    "ARG002",
    "ARG005",
    "B017",
    "E501",
    "PLR2004",
    "RUF013",
    "S101",
    "S105",
    "S106",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
faulthandler_timeout = 60
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:testcontainers.*",
]
markers = [
    "unit: fast isolated tests",
    "architecture: layer and structure tests",
    "api: in-process API tests without external services",
    "integration: requires docker or an external database",
    "e2e: full-stack HTTP flow with real Postgres, RabbitMQ and worker",
]
addopts = "-ra --strict-markers --strict-config --durations=10 -m 'not integration and not e2e'"

[tool.coverage.run]
branch = true
source = ["payment_service"]

[tool.coverage.report]
show_missing = true
fail_under = 100
precision = 2
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/payment_service/domain/*"]
pytest_add_cli_args = ["-q", "-m", "unit", "--disable-socket", "--allow-unix-socket"]
pytest_add_cli_args_test_selection = ["tests/unit/domain"]
mutate_only_covered_lines = true
do_not_mutate_patterns = ['^\s*raise ', 'event_field.name in']
